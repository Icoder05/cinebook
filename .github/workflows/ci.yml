name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit + API integration tests, including the 50-concurrent-holds test.
      # Runs on in-memory PGlite; set the TEST_DATABASE_URL secret to a throwaway
      # Neon branch to run the same suite against real concurrent Postgres.
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SWEEPER_INTERVAL_MS: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
